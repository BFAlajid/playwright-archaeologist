# Dependabot keeps npm deps and GitHub Actions pinned to current versions.
# Minor + patch updates are grouped to reduce PR churn; majors open individually
# so human review can catch breaking changes.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
